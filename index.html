<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kraftplan">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B1D1F">
<title>Kraftplan – Monatsübersicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1D1F;
    --panel: #24262A;
    --panel-2: #2C2F34;
    --line: #3A3D42;
    --chalk: #EDEEEC;
    --chalk-dim: #A8ABB0;
    --plate-red: #C8383A;
    --plate-blue: #2B6CB0;
    --plate-yellow: #D9A62E;
    --plate-green: #3F8F5D;
    --good: #4CAF7D;
    --bad: #C8383A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;background:var(--bg);color:var(--chalk);font-family:'Inter', sans-serif;}
  body{padding-bottom:env(safe-area-inset-bottom, 40px);}
  .wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 40px;}

  header{margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  h1{font-family:'Oswald', sans-serif;font-weight:700;font-size:22px;letter-spacing:0.4px;text-transform:uppercase;margin:0;}
  .subtitle{color:var(--chalk-dim);font-size:11.5px;margin-top:3px;}
  .icon-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--chalk-dim);width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer;flex-shrink:0;}

  .sync-status{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--chalk-dim);margin:-8px 0 14px;display:flex;align-items:center;gap:6px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--chalk-dim);}
  .sync-dot.ok{background:var(--good);}
  .sync-dot.err{background:var(--bad);}
  .sync-status button{background:none;border:none;color:var(--chalk-dim);text-decoration:underline;cursor:pointer;font-family:'Inter',sans-serif;font-size:10.5px;padding:0;margin-left:auto;}

  .settings-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;}
  .settings-panel h2{font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:0.4px;margin:0 0 4px;}
  .settings-panel p{font-size:12px;color:var(--chalk-dim);line-height:1.5;margin:0 0 12px;}
  .settings-panel label{display:block;font-size:11.5px;color:var(--chalk-dim);margin:10px 0 4px;}
  .settings-panel input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--chalk);font-family:'Space Mono',monospace;font-size:13px;padding:9px 10px;}
  .settings-panel .row-btns{display:flex;gap:8px;margin-top:14px;}
  .settings-panel button.primary{background:var(--plate-blue);border:none;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .settings-panel button.secondary{background:none;border:1px solid var(--line);color:var(--chalk-dim);padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .settings-panel a{color:var(--plate-blue);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;}
  .month-nav button{background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer;}
  .month-title{font-family:'Oswald',sans-serif;font-size:17px;letter-spacing:0.5px;text-transform:uppercase;}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
  .weekdays span{text-align:center;font-size:10.5px;color:var(--chalk-dim);font-family:'Space Mono',monospace;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cell{aspect-ratio:1/1;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-family:'Space Mono',monospace;}
  .cell.pad{visibility:hidden;cursor:default;}
  .cell.today{border-color:var(--chalk-dim);}
  .cell.selected{border-color:var(--chalk);box-shadow:0 0 0 1px var(--chalk) inset;}
  .cell .num{font-size:13px;}
  .cell .badge{margin-top:3px;width:16px;height:16px;border-radius:5px;font-size:9px;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:600;color:#12130f;}
  .badge-sq{background:var(--plate-red);color:#fff;}
  .badge-bp{background:var(--plate-blue);color:#fff;}
  .badge-dl{background:var(--plate-yellow);color:#1B1D1F;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 2px 4px;font-size:11.5px;color:var(--chalk-dim);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  .panel{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;}
  .panel-date{font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:12px;}
  .type-picker{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .type-btn{flex:1;min-width:90px;background:var(--panel-2);border:1px solid var(--line);color:var(--chalk-dim);padding:10px 6px;border-radius:9px;font-size:12.5px;font-family:'Inter',sans-serif;cursor:pointer;text-align:center;}
  .type-btn.active{color:var(--chalk);border-color:var(--chalk);}
  .type-btn .dotline{width:100%;height:3px;border-radius:2px;margin-top:6px;}
  .type-btn.clear{flex:0 0 auto;min-width:auto;padding:10px 12px;}

  .block{margin-bottom:24px;}
  .block-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--chalk-dim);letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .block-label .line{flex:1;height:1px;background:var(--line);}
  .pair{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:16px;}
  .pair::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;}
  .pair.pair-red::before{background:linear-gradient(var(--plate-red), var(--plate-blue));}
  .pair.pair-yellow::before{background:linear-gradient(var(--plate-yellow), var(--plate-green));}

  .exercise{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ex-name-row{display:flex;align-items:center;gap:8px;}
  .plate-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot-red{background:var(--plate-red);} .dot-blue{background:var(--plate-blue);}
  .dot-yellow{background:var(--plate-yellow);} .dot-green{background:var(--plate-green);}
  .ex-name{font-weight:600;font-size:14.5px;}
  .ex-muscle{color:var(--chalk-dim);font-size:12px;margin-top:2px;margin-left:18px;}
  .ex-target{font-family:'Space Mono',monospace;font-size:12px;color:var(--chalk-dim);white-space:nowrap;text-align:right;}

  .sets{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .set-row{display:grid;grid-template-columns:24px 1fr 1fr 34px;gap:8px;align-items:center;}
  .set-idx{font-family:'Space Mono',monospace;font-size:11px;color:var(--chalk-dim);}
  .set-row input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--chalk);font-family:'Space Mono',monospace;font-size:13.5px;padding:7px 8px;width:100%;}
  .set-row input::placeholder{color:#6b6e73;}
  .set-row input:focus{outline:none;border-color:var(--plate-blue);}
  .done-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--chalk-dim);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .done-btn.done{background:var(--good);border-color:var(--good);color:#0e1a13;}

  .rest-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;margin-left:16px;margin-top:10px;font-family:'Space Mono',monospace;font-size:12.5px;}
  .rest-bar span.label{color:var(--chalk-dim);}
  .rest-controls{display:flex;align-items:center;gap:10px;}
  .rest-time{font-size:16px;min-width:48px;text-align:right;}
  .rest-time.running{color:var(--plate-yellow);}
  .rest-time.zero{color:var(--good);}
  .rest-btn{background:none;border:1px solid var(--line);color:var(--chalk);border-radius:6px;padding:5px 10px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;}
  .block-note{font-size:12px;color:var(--chalk-dim);text-align:center;margin:10px 0 4px;font-style:italic;}

  .loading{padding:60px 20px;text-align:center;color:var(--chalk-dim);font-family:'Space Mono',monospace;font-size:13px;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Lade Trainingsdaten …</div></div>

<script>
const SESSIONS = {
  sq: { key:'sq', title:'Squat-Tag', sub:'Unterkörper & Rumpf', letter:'A', badge:'badge-sq', dotColor:'var(--plate-red)', blocks:[
    { id:'A', afterNote:'3 Minuten Pause nach Block A', pairColor:'red', pairs:[
      { id:'sq-a1', name:'Kniebeugen (Squats)', muscle:'Beinstrecker (Vorderseite)', dot:'red', sets:4, targetReps:'3–5', pause:'2 Min.' },
      { id:'sq-a2', name:'Rumänisches Kreuzheben', muscle:'Beinbeuger (Rückseite)', dot:'blue', sets:4, targetReps:'3–5', pause:'2 Min.' }
    ]},
    { id:'B', pairColor:'yellow', pairs:[
      { id:'sq-b1', name:'Ausfallschritte (Lunges)', muscle:'Beine dynamisch / Unilateral', dot:'yellow', sets:3, targetReps:'5 / Bein', pause:'90 Sek.' },
      { id:'sq-b2', name:'Planks mit Zusatzgewicht', muscle:'Rumpf / Abdomen', dot:'green', sets:3, targetReps:'45 Sek.', pause:'90 Sek.' }
    ]}
  ]},
  bp: { key:'bp', title:'Bench-Tag', sub:'Oberkörper – Drücken & Ziehen', letter:'B', badge:'badge-bp', dotColor:'var(--plate-blue)', blocks:[
    { id:'A', afterNote:'3 Minuten Pause nach Block A', pairColor:'red', pairs:[
      { id:'bp-a1', name:'Bankdrücken (Bench Press)', muscle:'Brust / Drücken horizontal', dot:'red', sets:4, targetReps:'3–5', pause:'2 Min.' },
      { id:'bp-a2', name:'Langhantelrudern (Barbell Row)', muscle:'Rücken / Ziehen horizontal', dot:'blue', sets:4, targetReps:'3–5', pause:'2 Min.' }
    ]},
    { id:'B', pairColor:'yellow', pairs:[
      { id:'bp-b1', name:'Schulterdrücken (Overhead Press)', muscle:'Schultern / Drücken vertikal', dot:'yellow', sets:3, targetReps:'3–5', pause:'2 Min.' },
      { id:'bp-b2', name:'Klimmzüge mit Zusatzgewicht (oder Latzug)', muscle:'Latissimus / Ziehen vertikal', dot:'green', sets:3, targetReps:'3–5', pause:'2 Min.' }
    ]}
  ]},
  dl: { key:'dl', title:'Deadlift-Tag', sub:'Ganzkörper & Kette hinten/vorne', letter:'C', badge:'badge-dl', dotColor:'var(--plate-yellow)', blocks:[
    { id:'A', afterNote:'3 Minuten Pause nach Block A', pairColor:'red', pairs:[
      { id:'dl-a1', name:'Kreuzheben (Deadlift)', muscle:'Ganzkörper / Kette hinten', dot:'red', sets:4, targetReps:'1–3', pause:'2.5 Min.' },
      { id:'dl-a2', name:'Schrägbankdrücken mit Kurzhanteln', muscle:'Brust oben / Drücken', dot:'blue', sets:4, targetReps:'3–5', pause:'2.5 Min.' }
    ]},
    { id:'B', pairColor:'yellow', pairs:[
      { id:'dl-b1', name:'Face Pulls', muscle:'Hintere Schulter / Rotatoren', dot:'yellow', sets:3, targetReps:'10–12', pause:'60 Sek.' },
      { id:'dl-b2', name:'Abdominal Rollouts', muscle:'Rumpf / Bauch', dot:'green', sets:3, targetReps:'5–8', pause:'60 Sek.' }
    ]}
  ]}
};

const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WEEKDAYS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const WEEKDAYS_LONG = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];

function pad(n){ return String(n).padStart(2,'0'); }
function toKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
const today = new Date();
const todayKey = toKey(today.getFullYear(), today.getMonth(), today.getDate());

let viewYear = today.getFullYear();
let viewMonth = today.getMonth();
let selectedDate = null;
let showSettings = false;

// Gesamter Datenblock: wird lokal gecacht UND (falls eingerichtet) mit GitHub synchronisiert
let store = { dayTypes:{}, logs:{}, lastKg:{} };
let ghConfig = null; // {owner, repo, token}
let ghSha = null;    // aktueller Datei-Hash auf GitHub, nötig zum Ueberschreiben
let syncState = 'off'; // off | ok | syncing | error
let lastSyncTime = null;
let saveTimeout = null;

const timers = {};

function pauseSecondsFromString(str){
  const m = str.match(/([\d.]+)/);
  if(!m) return 120;
  const n = parseFloat(m[1]);
  return str.toLowerCase().includes('min') ? Math.round(n*60) : Math.round(n);
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str))); }

function loadLocalCache(){
  try{
    const raw = localStorage.getItem('kraftplan-data');
    if(raw) store = JSON.parse(raw);
  }catch(e){}
  try{
    const cfg = localStorage.getItem('gh-config');
    if(cfg) ghConfig = JSON.parse(cfg);
  }catch(e){}
}
function saveLocalCache(){
  try{ localStorage.setItem('kraftplan-data', JSON.stringify(store)); }catch(e){}
}

async function ghLoad(){
  if(!ghConfig || !ghConfig.owner || !ghConfig.repo || !ghConfig.token) return false;
  syncState = 'syncing'; render();
  try{
    const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/data.json`;
    const res = await fetch(url, { headers: { 'Authorization': 'token '+ghConfig.token, 'Accept':'application/vnd.github+json' } });
    if(res.status === 404){
      ghSha = null;
      syncState = 'ok'; lastSyncTime = new Date();
      return true; // noch keine Datei auf GitHub - lokaler Stand gilt als Basis
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    ghSha = json.sha;
    const content = b64DecodeUnicode(json.content.replace(/\n/g,''));
    store = JSON.parse(content);
    saveLocalCache();
    syncState = 'ok'; lastSyncTime = new Date();
    return true;
  }catch(e){
    syncState = 'error';
    return false;
  }
}

async function ghSave(){
  if(!ghConfig || !ghConfig.owner || !ghConfig.repo || !ghConfig.token) return;
  syncState = 'syncing'; render();
  try{
    const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/data.json`;
    const body = {
      message: 'Kraftplan-Daten aktualisiert',
      content: b64EncodeUnicode(JSON.stringify(store, null, 2))
    };
    if(ghSha) body.sha = ghSha;
    const res = await fetch(url, {
      method:'PUT',
      headers:{ 'Authorization':'token '+ghConfig.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    ghSha = json.content.sha;
    syncState = 'ok'; lastSyncTime = new Date();
  }catch(e){
    syncState = 'error';
  }
  render();
}

function scheduleSave(){
  saveLocalCache();
  if(saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(()=>{ ghSave(); }, 900);
}

async function setDayType(date, sessionKey){
  if(sessionKey) store.dayTypes[date] = sessionKey;
  else delete store.dayTypes[date];
  scheduleSave();
}

function getExercise(date, ex){
  const cacheKey = date+':'+ex.id;
  let data = store.logs[cacheKey];
  if(!data || !Array.isArray(data.rows) || data.rows.length !== ex.sets){
    const lastKg = store.lastKg[ex.id] || '';
    data = { rows: Array.from({length:ex.sets}, ()=>({kg:lastKg, reps:'', done:false})) };
    store.logs[cacheKey] = data;
  }
  return data;
}

function renderCalendar(){
  const first = new Date(viewYear, viewMonth, 1);
  const offset = (first.getDay()+6)%7;
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="cell pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = toKey(viewYear, viewMonth, d);
    const type = store.dayTypes[key];
    const isToday = key === todayKey;
    const isSel = key === selectedDate;
    cells += `
      <div class="cell ${isToday?'today':''} ${isSel?'selected':''}" data-date="${key}">
        <span class="num">${d}</span>
        ${type ? `<span class="badge ${SESSIONS[type].badge}">${SESSIONS[type].letter}</span>` : ''}
      </div>
    `;
  }

  return `
    <div class="month-nav">
      <button data-nav="-1">‹</button>
      <span class="month-title">${MONTHS[viewMonth]} ${viewYear}</span>
      <button data-nav="1">›</button>
    </div>
    <div class="weekdays">${WEEKDAYS.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="legend">
      ${Object.values(SESSIONS).map(s=>`<span><i style="background:${s.dotColor}"></i>${s.letter} · ${s.title}</span>`).join('')}
    </div>
  `;
}

function renderPanel(){
  if(!selectedDate) return '';

  const [y,m,d] = selectedDate.split('-').map(Number);
  const wd = WEEKDAYS_LONG[(new Date(y, m-1, d).getDay()+6)%7];
  const sessionKey = store.dayTypes[selectedDate];

  let html = `<div class="panel">
    <div class="panel-date">${wd}, ${d}. ${MONTHS[m-1]} ${y}</div>
    <div class="type-picker">
      ${Object.values(SESSIONS).map(s => `
        <button class="type-btn ${sessionKey===s.key?'active':''}" data-set-type="${s.key}">
          ${s.letter} · ${s.title}
          <div class="dotline" style="background:${s.dotColor}"></div>
        </button>
      `).join('')}
      <button class="type-btn clear" data-set-type="">✕ Kein Training</button>
    </div>
  `;

  if(sessionKey){
    const session = SESSIONS[sessionKey];
    session.blocks.forEach(block=>{
      html += `<div class="block"><div class="block-label"><span>BLOCK ${block.id}</span><span class="line"></span></div>`;
      block.pairs.forEach((ex, idx)=>{
        const data = getExercise(selectedDate, ex);
        html += `<div class="pair pair-${block.pairColor}" style="margin-bottom:${idx===0?'10px':'0'};">
          <div class="exercise">
            <div class="ex-head">
              <div>
                <div class="ex-name-row"><span class="plate-dot dot-${ex.dot}"></span><span class="ex-name">${ex.id.split('-')[1].toUpperCase()} · ${ex.name}</span></div>
                <div class="ex-muscle">${ex.muscle}</div>
              </div>
              <div class="ex-target">${ex.sets} × ${ex.targetReps}<br>Pause ${ex.pause}</div>
            </div>
            <div class="sets">
              ${data.rows.map((row,i)=>`
                <div class="set-row">
                  <span class="set-idx">${i+1}</span>
                  <input type="text" inputmode="decimal" placeholder="kg" value="${row.kg}" data-ex="${ex.id}" data-i="${i}" data-field="kg">
                  <input type="text" inputmode="decimal" placeholder="Wdh." value="${row.reps}" data-ex="${ex.id}" data-i="${i}" data-field="reps">
                  <button class="done-btn ${row.done?'done':''}" data-ex="${ex.id}" data-i="${i}">${row.done?'✓':''}</button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>`;
      });
      const pairKey = block.id+'-'+selectedDate;
      const secs = pauseSecondsFromString(block.pairs[0].pause);
      if(!timers[pairKey]) timers[pairKey] = {remaining:secs, running:false, total:secs};
      const t = timers[pairKey];
      html += `<div class="rest-bar">
        <span class="label">Pause ${block.id}1 ⇄ ${block.id}2</span>
        <div class="rest-controls">
          <span class="rest-time ${t.running?'running':(t.remaining===0?'zero':'')}" id="time-${pairKey}">${fmtTime(t.remaining)}</span>
          <button class="rest-btn" data-timer="${pairKey}" data-action="toggle">${t.running?'Pause':'Start'}</button>
          <button class="rest-btn" data-timer="${pairKey}" data-action="reset">↺</button>
        </div>
      </div>`;
      if(block.afterNote) html += `<div class="block-note">— ${block.afterNote} —</div>`;
      html += `</div>`;
    });
  }

  html += `</div>`;
  return html;
}

function renderSettings(){
  if(!showSettings) return '';
  const cfg = ghConfig || {owner:'', repo:'', token:''};
  return `
    <div class="settings-panel">
      <h2>Geräteübergreifende Synchronisation</h2>
      <p>Daten werden in einer Datei <code>data.json</code> in deinem GitHub-Repository gespeichert. Auf jedem Gerät hier dieselben Angaben eintragen, dann sind die Einträge überall gleich.</p>
      <label>GitHub-Benutzername</label>
      <input id="cfg-owner" type="text" value="${cfg.owner}" placeholder="z. B. maxmuster" autocapitalize="off" autocorrect="off">
      <label>Repository-Name</label>
      <input id="cfg-repo" type="text" value="${cfg.repo}" placeholder="z. B. kraftplan" autocapitalize="off" autocorrect="off">
      <label>Personal Access Token</label>
      <input id="cfg-token" type="password" value="${cfg.token}" placeholder="ghp_..." autocapitalize="off" autocorrect="off">
      <p style="margin-top:8px;">Token erstellen unter github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens, mit Schreibrecht ("Contents: Read and write") für dieses Repository.</p>
      <div class="row-btns">
        <button class="primary" id="cfg-save">Speichern & synchronisieren</button>
        <button class="secondary" id="cfg-close">Schliessen</button>
      </div>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  let statusLabel = 'Nur auf diesem Gerät gespeichert';
  let dotClass = '';
  if(ghConfig && ghConfig.token){
    if(syncState==='syncing'){ statusLabel = 'Synchronisiere …'; dotClass=''; }
    else if(syncState==='ok'){ statusLabel = 'Synchronisiert' + (lastSyncTime ? ' · '+lastSyncTime.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) : ''); dotClass='ok'; }
    else if(syncState==='error'){ statusLabel = 'Synchronisation fehlgeschlagen'; dotClass='err'; }
  }

  app.innerHTML = `
    <header>
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 30 30" fill="none">
          <rect x="1" y="13" width="4" height="4" rx="1" fill="#C8383A"/>
          <rect x="6" y="10" width="3" height="10" rx="1" fill="#D9A62E"/>
          <rect x="10" y="13.5" width="10" height="3" fill="#EDEEEC"/>
          <rect x="21" y="10" width="3" height="10" rx="1" fill="#D9A62E"/>
          <rect x="25" y="13" width="4" height="4" rx="1" fill="#2B6CB0"/>
        </svg>
        <div>
          <h1>Kraftplan</h1>
          <div class="subtitle">Antagonisten-Supersätze</div>
        </div>
      </div>
      <button class="icon-btn" id="settings-toggle">⚙</button>
    </header>
    <div class="sync-status">
      <span class="sync-dot ${dotClass}"></span>
      <span>${statusLabel}</span>
      ${ghConfig && ghConfig.token ? `<button id="manual-sync">Jetzt aktualisieren</button>` : ''}
    </div>
    ${renderSettings()}
    ${renderCalendar()}
    ${renderPanel()}
  `;
  attachHandlers();
}

function attachHandlers(){
  const st = document.getElementById('settings-toggle');
  if(st) st.addEventListener('click', ()=>{ showSettings = !showSettings; render(); });

  const closeBtn = document.getElementById('cfg-close');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ showSettings=false; render(); });

  const saveBtn = document.getElementById('cfg-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const owner = document.getElementById('cfg-owner').value.trim();
    const repo = document.getElementById('cfg-repo').value.trim();
    const token = document.getElementById('cfg-token').value.trim();
    ghConfig = { owner, repo, token };
    try{ localStorage.setItem('gh-config', JSON.stringify(ghConfig)); }catch(e){}
    showSettings = false;
    const ok = await ghLoad();
    if(!ok && syncState==='error'){
      // Falls noch keine Datei existiert, direkt den aktuellen lokalen Stand hochladen
      await ghSave();
    } else if(ghSha===null){
      await ghSave();
    }
    render();
  });

  const manualSync = document.getElementById('manual-sync');
  if(manualSync) manualSync.addEventListener('click', async ()=>{ await ghLoad(); render(); });

  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const dir = parseInt(btn.dataset.nav);
      viewMonth += dir;
      if(viewMonth<0){ viewMonth=11; viewYear--; }
      if(viewMonth>11){ viewMonth=0; viewYear++; }
      render();
    });
  });

  document.querySelectorAll('.cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{ selectedDate = cell.dataset.date; render(); });
  });

  document.querySelectorAll('[data-set-type]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const val = btn.dataset.setType;
      await setDayType(selectedDate, val || null);
      render();
    });
  });

  document.querySelectorAll('.set-row input').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const {ex, i, field} = e.target.dataset;
      const cacheKey = selectedDate+':'+ex;
      store.logs[cacheKey].rows[i][field] = e.target.value;
      if(field==='kg') store.lastKg[ex] = e.target.value;
      scheduleSave();
    });
  });

  document.querySelectorAll('.done-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const {ex, i} = btn.dataset;
      const cacheKey = selectedDate+':'+ex;
      store.logs[cacheKey].rows[i].done = !store.logs[cacheKey].rows[i].done;
      scheduleSave();
      render();
    });
  });

  document.querySelectorAll('[data-timer]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.timer;
      const action = btn.dataset.action;
      const t = timers[key];
      if(action==='reset'){
        clearInterval(t.intervalId);
        t.running=false; t.remaining=t.total;
        render();
        return;
      }
      if(action==='toggle'){
        if(t.running){ clearInterval(t.intervalId); t.running=false; }
        else{
          t.running=true;
          t.intervalId = setInterval(()=>{
            t.remaining--;
            const el = document.getElementById('time-'+key);
            if(el){
              el.textContent = fmtTime(Math.max(t.remaining,0));
              el.className = 'rest-time ' + (t.remaining<=0?'zero':'running');
            }
            if(t.remaining<=0){ clearInterval(t.intervalId); t.running=false; }
          },1000);
        }
        render();
      }
    });
  });
}

async function init(){
  loadLocalCache();
  render();
  if(ghConfig && ghConfig.token){
    await ghLoad();
    render();
  }
}
init();
</script>
</body>
</html>
